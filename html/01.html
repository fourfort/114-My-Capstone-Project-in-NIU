<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>Happy Birthday 文音！</title>
  <style>
    body {
      background: linear-gradient(to right, #ffe6f0, #ffe);
      font-family: "Helvetica Neue", sans-serif;
      text-align: center;
      padding: 50px;
    }
    h1 {
      font-size: 3em;
      color: hotpink;
    }
    p {
      font-size: 1.3em;
      color: #333;
    }
    .heart {
      font-size: 2em;
      color: red;
      animation: beat 1s infinite;
    }
    @keyframes beat {
      0% { transform: scale(1); }
      50% { transform: scale(1.3); }
      100% { transform: scale(1); }
    }
    .song-list {
      margin-top: 20px;
      font-style: italic;
      color: #555;
    }
    .code-style {
      margin-top: 30px;
      background: #111;
      color: #0f0;
      padding: 15px;
      border-radius: 10px;
      text-align: left;
      width: fit-content;
      margin-left: auto;
      margin-right: auto;
      font-family: monospace;
    }
  </style>
</head>
<body>

  <h1>🎉 生日快樂，梁文音！</h1>
  <div class="heart">♥</div>
  <p>今天是你的日子，這是一位軟體工程師的科技式生日祝福：</p>

  <div class="song-list">
    <p>♪ 情歌故事中選: 伴奏</p>
    <p>♪ 手機裡第一首歌: 月光地毯</p>
    <p>♪ 近期最愛: 愛其實很殘忍</p>
  </div>

  <p>願姊的每一首歌都像程式一樣 —— <strong>永不 crash，人氣無限 loop！</strong></p>

  <div class="code-style">
    <pre>
function happyBirthday(name) {
  return `${name}，祝你生日快樂！`;
}
const fromFan = "來自一位寫程式的超級粉絲";
console.log(happyBirthday("梁文音"));
// ♥ return happiness;
    </pre>
  </div>

  <p style="margin-top: 40px; color: gray;">-- 由 音符工程師 粉絲手寫呈現</p>

</body>
</html>
