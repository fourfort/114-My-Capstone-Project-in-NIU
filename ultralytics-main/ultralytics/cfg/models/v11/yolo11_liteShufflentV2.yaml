# Ultralytics YOLO 🚀, AGPL-3.0 license
# YOLO11 object detection model with P3-P5 outputs. For Usage examples see https://docs.ultralytics.com/tasks/detect

# Parameters
nc: 80 # number of classes
scales: # model compound scaling constants, i.e. 'model=yolo11n.yaml' will call yolo11.yaml with scale 'n'
  # [depth, width, max_channels]
  s: [0.50, 0.50, 1024] # summary: 319 layers, 9458752 parameters, 9458736 gradients, 21.7 GFLOPs

backbone:    #3*640*640
  # [from, repeats, module, args]
  - [-1, 1, liteConv_maxpool, [24]]    # 0-P2/4       #24*160*160
  - [-1, 1, liteShuffleNetV2, [116, 2]] # 1-P3/8       #channel，步距
  - [-1, 3, liteShuffleNetV2, [116, 1]] # 2
  - [-1, 1, liteShuffleNetV2, [232, 2]] # 3-P4/16
  - [-1, 7, liteShuffleNetV2, [232, 1]] # 4
  - [-1, 1, liteShuffleNetV2, [464, 2]] # 5-P5/32
  - [-1, 3, liteShuffleNetV2, [464, 1]] # 6
  - [-1, 1, SPPF, [1024, 5]]  # 7
  - [-1, 2, C2PSA, [1024]] # 8
 
# YOLOv11.0n head
head:
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]  #9
  - [[-1, 4], 1, Concat, [1]]  # cat backbone P4   10
  - [-1, 2, C3k2, [512, False]] # 11
 
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 2], 1, Concat, [1]]  # cat backbone P3
  - [-1, 2, C3k2, [256, False]]  # 14 (P3/8-small)
 
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 11], 1, Concat, [1]]  # cat head P4
  - [-1, 2, C3k2, [512, False]] # 17 (P4/16-medium)
 
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 8], 1, Concat, [1]]  # cat head P5
  - [-1, 2, C3k2, [1024, True]] # 20 (P5/32-large)
 
  - [[14, 17, 20], 1, Detect, [nc]]  # Detect(P3, P4, P5)
